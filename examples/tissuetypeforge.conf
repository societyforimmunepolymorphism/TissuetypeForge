# tissuetypeforge-run.sh configuration (KEY=VALUE; parsed, never sourced).

# Population typing model (required). Relative paths resolve against this file.
POPULATION=../populations/registry_example.toml

# RNG seed; same input + config + seed => identical output. Empty = unseeded.
SEED=42

# permissive: report bad records on stderr and continue; strict: abort (exit 1).
MODE=permissive

# Input CSV column names.
ID_COLUMN=id
GL_COLUMN=glstring
