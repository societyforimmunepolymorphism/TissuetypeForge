# glnorm-run.sh configuration (KEY=VALUE; parsed, never sourced).
# Every key is optional; the values below are the defaults except where noted.

# --- input columns ---------------------------------------------------------
GL_COLUMN=genotype            # default: gl_string
DONOR_COLUMN=subject          # default: none (no donor column in output)

# --- loci -------------------------------------------------------------------
LOCI=A,C,B,DRB1,DQB1          # used for ENFORCE_LOCI and recorded in the manifest
LOCUS_PREFIX=HLA-
ENFORCE_LOCI=false            # true: records with loci outside LOCI are errors

# --- the three operations (independent) ------------------------------------
NORMALIZE=true                # 1. nomenclature normalization (lossless)
REDUCE=false                  # 2. py-ard allele reduction (LOSSY, opt-in)
REDUX_TYPE=lgx                #    G P lg lgx W exon U2 S  (lgx != 2-field truncation)
SORT=true                     # 3. canonical ordering (gl-smartsort)

# --- reference DB and error handling ----------------------------------------
IMGT_VERSION=                 # empty = latest locally available; e.g. 3550
MODE=permissive               # permissive | strict
